name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.diff.outputs.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against base
        id: diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            range="HEAD~1...HEAD"
          else
            range=""
          fi

          if [ -z "$range" ]; then
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "$range")"
          fi

          echo "Changed files:"
          echo "$files"

          if grep -qE '^(src/|Makefile$|pkg/|install\.sh$|uninstall\.sh$|completions/)' <<< "$files"; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash syntax error"
              fail=1
            fi
          done < <(git ls-files '*.sh')
          exit $fail

      - name: Info.plist parses
        run: |
          python3 - <<'PY'
          import plistlib

          with open('src/app/Info.plist', 'rb') as f:
              d = plistlib.load(f)

          for key in ('CFBundleIdentifier', 'CFBundleName', 'LSMinimumSystemVersion'):
              assert d.get(key), f'{key} missing from Info.plist'

          print('Info.plist ok:', d['CFBundleIdentifier'], d['LSMinimumSystemVersion'])
          PY

      - name: Cask parses and is not ahead of the app version
        run: |
          set -euo pipefail
          ruby -c Casks/byper.rb
          ruby - <<'RB'
          require 'rubygems'

          plist = File.read('src/app/Info.plist')
          app = plist[%r{<key>CFBundleShortVersionString</key>\s*<string>([^<]+)</string>}, 1]
          cask = File.read('Casks/byper.rb')[%r{^\s*version\s+"([^"]+)"}, 1]
          sha = File.read('Casks/byper.rb')[%r{^\s*sha256\s+"([0-9a-f]{64})"}, 1]
          abort 'no CFBundleShortVersionString in Info.plist' if app.nil?
          abort 'no version stanza in Casks/byper.rb' if cask.nil?
          abort 'Casks/byper.rb needs a real 64 character sha256' if sha.nil?

          # The cask tracks stable releases and is bumped at stable release time,
          # not at pre-release time. It may lag Info.plist during a beta or rc
          # cycle, but it must never point past the app version.
          if Gem::Version.new(cask) > Gem::Version.new(app)
            abort "cask version #{cask} is ahead of Info.plist #{app}"
          end

          puts "cask version #{cask} is not ahead of Info.plist #{app}"
          RB

      - name: CLI version derives from Info.plist
        run: |
          set -euo pipefail
          ruby - <<'RB'
          main = File.read('src/main.c')
          mk = File.read('Makefile')

          literal = main[/"\d+\.\d+\.\d+"/]
          abort "src/main.c hardcodes a version: #{literal}" if literal
          abort 'src/main.c still defines VERSION' if main =~ /#define\s+VERSION\b/
          abort 'src/main.c does not use BYPER_VERSION' unless main.include?('BYPER_VERSION')
          version_line = mk.lines.find { |l| l =~ /^BYPER_VERSION\s*\?=/ }
          abort 'Makefile does not allow a BYPER_VERSION override' if version_line.nil?
          abort 'Makefile does not read CFBundleShortVersionString from Info.plist' unless version_line.include?('CFBundleShortVersionString') && version_line.include?('src/app/Info.plist')
          abort 'Makefile does not read the plist with plutil or PlistBuddy' unless version_line =~ /plutil|PlistBuddy/
          compile = mk.lines.find { |l| l.include?('$(CC)') && l.include?('$(SRC)') }
          abort 'Makefile has no CLI compile line' if compile.nil?
          abort 'Makefile does not pass the version define to the compiler' unless compile.include?('VERSION_DEFINE') || compile.include?('-DBYPER_VERSION')
          puts 'CLI version derives from Info.plist'
          RB

      - name: No installer artifacts committed
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(pkg|dmg)$'; then
            echo "::error::Installer artifacts ship via Releases, not git."
            exit 1
          fi

      - name: No build-variant guards
        run: |
          set -euo pipefail
          if grep -rn 'VANILLA' src/ Makefile; then
            echo "::error::The VANILLA guards were removed; do not reintroduce them."
            exit 1
          fi

      - name: Workflow YAML parses
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do
            ruby -ryaml -e 'YAML.load_file(ARGV[0])' "$f"
            echo "ok: $f"
          done

      - name: Docs links and anchors
        run: |
          python3 - <<'PY'
          import os, re, sys

          files = ['README.md']
          if os.path.isdir('docs'):
              files += [os.path.join('docs', f) for f in sorted(os.listdir('docs')) if f.endswith('.md')]

          def slug(heading):
              s = heading.strip().lower()
              s = re.sub(r'[^\w\s-]', '', s)
              return re.sub(r'\s+', '-', s)

          headings = {}
          for f in files:
              text = open(f, encoding='utf-8').read()
              headings[f] = {slug(m.group(1)) for m in re.finditer(r'^#{1,6}\s+(.+)$', text, re.M)}

          bad = []
          for f in files:
              text = open(f, encoding='utf-8').read()
              for m in re.finditer(r'\]\(([^)\s]+)\)', text):
                  target = m.group(1)
                  if target.startswith(('http://', 'https://', 'mailto:')):
                      continue

                  path, _, frag = target.partition('#')
                  if path:
                      resolved = os.path.normpath(os.path.join(os.path.dirname(f), path))
                      if not os.path.exists(resolved):
                          bad.append(f'{f}: missing file for {target}')
                          continue
                  else:
                      resolved = f

                  if frag and resolved in headings and frag not in headings[resolved]:
                      bad.append(f'{f}: no heading #{frag} in {resolved}')

          if bad:
              for b in bad:
                  print(f'::error::{b}')
              sys.exit(1)

          print(f'All links and anchors resolve across {len(files)} files.')
          PY

  compile:
    name: Compile check
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make all

      - name: Verify artifacts
        run: |
          set -euo pipefail
          test -x bin/byper
          test -x bin/byper-mon.command
          test -x byper.app/Contents/MacOS/byper
          file bin/byper | grep -q 'Mach-O 64-bit executable arm64'
          codesign --verify --deep --strict byper.app

      - name: CLI smoke test
        run: |
          set -euo pipefail
          ./bin/byper --help | grep -q 'Usage:'

      - name: CLI version matches Info.plist
        run: |
          set -euo pipefail
          app="$(plutil -extract CFBundleShortVersionString raw -o - src/app/Info.plist)"
          cli="$(./bin/byper --help | awk 'NR == 1 { sub(/^v/, "", $NF); print $NF }')"
          echo "Info.plist: $app"
          echo "CLI:        $cli"
          test "$cli" = "$app"
